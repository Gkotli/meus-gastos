<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus Gastos</title>
<meta name="description" content="Controle de gastos pessoais: lançamentos, orçamento, contas e relatórios. Funciona offline.">

<!-- Cor da barra do navegador (claro / escuro) -->
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1117" media="(prefers-color-scheme: dark)">

<!-- iOS: "Adicionar à Tela de Início" -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- "default" mantém o texto da barra de status legível no tema claro e no escuro.
     Se preferir a barra transparente sobre o app, troque por "black-translucent". -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

<style>
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --text:#1B2230; --muted:#778197; --line:#E6EAF1;
  --accent:#5B7CFA; --accent-soft:rgba(91,124,250,.12);
  --green:#1FA971; --green-soft:rgba(31,169,113,.12);
  --red:#E5484D;   --red-soft:rgba(229,72,77,.11);
  --amber:#F0A020; --amber-soft:rgba(240,160,32,.17);
  --tabbg:rgba(255,255,255,.92);
  --shadow:0 1px 2px rgba(20,30,50,.04),0 8px 22px rgba(20,30,50,.06);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --tab-h:58px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1117; --card:#171B24; --text:#EDF0F6; --muted:#8E98AB; --line:#272D3A;
    --accent:#7F9AFF; --accent-soft:rgba(127,154,255,.16);
    --green:#3DD598; --green-soft:rgba(61,213,152,.14);
    --red:#FF6B70;   --red-soft:rgba(255,107,112,.14);
    --amber:#FFB640; --amber-soft:rgba(255,182,64,.16);
    --tabbg:rgba(23,27,36,.92);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1117; --card:#171B24; --text:#EDF0F6; --muted:#8E98AB; --line:#272D3A;
  --accent:#7F9AFF; --accent-soft:rgba(127,154,255,.16);
  --green:#3DD598; --green-soft:rgba(61,213,152,.14);
  --red:#FF6B70;   --red-soft:rgba(255,107,112,.14);
  --amber:#FFB640; --amber-soft:rgba(255,182,64,.16);
  --tabbg:rgba(23,27,36,.92);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);max-width:100%}
svg{display:block}
[hidden]{display:none!important}
.sm{font-size:13px}.muted{color:var(--muted)}
.g{color:var(--green)}.r{color:var(--red)}

#app{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding-bottom:calc(var(--tab-h) + var(--sab) + 110px)}

/* ---------- topo ---------- */
.top{padding:calc(var(--sat) + 10px) 16px 0}
.top h1{margin:0 0 6px 4px;font-size:30px;font-weight:800;letter-spacing:-.02em}
.mwrap{position:sticky;top:var(--sat);z-index:20;background:var(--bg);padding:6px 16px 10px}
.mbar{display:flex;align-items:center;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.mbar button{min-height:50px;display:grid;place-items:center}
.mbar .arrow{width:56px;color:var(--accent)}
.mbar .mlbl{flex:1;font-weight:700;font-size:17px;text-align:center;line-height:1.15}
.mbar .mlbl small{display:block;font-weight:500;color:var(--muted);font-size:11px}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin:12px 16px;overflow:hidden}
.pad{padding:16px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 20px 0;font-size:13px;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sec .lnk{color:var(--accent);text-transform:none;letter-spacing:0;font-size:15px;font-weight:600;min-height:32px}
.hero{padding:20px 18px 18px}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.025em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.hero .cmp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.split>div{background:var(--bg);border-radius:16px;padding:12px}
.split .k{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.split .v{font-size:19px;font-weight:800;margin:4px 0 6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.green{background:var(--green)}.dot.red{background:var(--red)}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.chip.good{background:var(--green-soft);color:var(--green)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.flat{background:var(--line);color:var(--muted)}
.alert{display:block;width:calc(100% - 32px);text-align:left;padding:14px 16px;background:var(--amber-soft)}
.alert.over{background:var(--red-soft)}
.alert b{display:block;margin-bottom:4px}
.alert div{font-size:14px;margin-top:2px}

/* ---------- linhas ---------- */
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;min-height:62px}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none}
.rmain{flex:1;min-width:0}
.rmain b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmain small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ramt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ramt.despesa{color:var(--red)}.ramt.receita{color:var(--green)}
.day{display:flex;justify-content:space-between;padding:16px 22px 6px;font-size:13px;font-weight:700;color:var(--muted)}
.sumline{display:flex;gap:14px;align-items:center;justify-content:space-between;margin:6px 20px 0;font-size:14px;font-weight:600}
.more{margin:8px 16px}
.empty{text-align:center;padding:40px 26px;color:var(--muted)}
.empty .e{font-size:42px;margin-bottom:6px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.total{display:flex;justify-content:space-between;padding:14px 16px;font-weight:800;background:var(--bg)}

/* ---------- filtros ---------- */
.filters{padding:0 16px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:var(--shadow);color:var(--muted)}
.search input{flex:1;border:0;background:none;min-height:50px;outline:none;min-width:0}
.fsel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.fsel select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 8px;width:100%;min-width:0}
.chk{display:flex;align-items:center;gap:10px;margin:10px 4px 0;font-size:15px;min-height:36px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}

/* ---------- orçamento ---------- */
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s}
.bar.ok i{background:var(--green)}.bar.warn i{background:var(--amber)}.bar.over i{background:var(--red)}
.brow{display:block;width:100%;padding:14px 16px}
.brow .l1{display:flex;align-items:center;gap:12px}
.brow .l2{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.over{background:var(--red-soft);color:var(--red)}

/* ---------- relatórios ---------- */
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:11px;font-weight:600;text-align:center;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg.exp button.on{color:var(--red)}.seg.inc button.on{color:var(--green)}
.donut{width:220px;height:220px;margin:6px auto}
.donut .dt{fill:var(--text)}.donut .ds{fill:var(--muted)}
.leg .row{min-height:54px}
.leg .ramt{min-width:98px;text-align:right}
.leg .pct{color:var(--muted);font-size:13px;margin-left:6px;font-weight:500}
.bars{width:100%;height:auto}
.bars .gl{stroke:var(--line);stroke-width:1}
.bars text{fill:var(--muted);font-size:10px}
.bars .sel text.m{fill:var(--text);font-weight:700}
.bars .ba{fill:var(--green)}.bars .bd{fill:var(--red)}
.bars g:not(.sel) .ba,.bars g:not(.sel) .bd{opacity:.55}
.bsum{display:flex;justify-content:space-between;gap:10px;padding:0 16px 16px}
.bsum div{flex:1;background:var(--bg);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted)}
.bsum b{display:block;font-size:17px;color:var(--text);font-variant-numeric:tabular-nums}

/* ---------- ajustes ---------- */
.set .row{min-height:56px}
.set .row .ico{width:36px;height:36px;font-size:18px;border-radius:11px}
.set .chev{color:var(--muted)}
.ver{text-align:center;color:var(--muted);font-size:13px;padding:18px 24px 0;line-height:1.5}

/* ---------- barra inferior + FAB ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:var(--sab);background:var(--tabbg);border-top:1px solid var(--line);
  -webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}
.tab{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--accent)}
.fab{position:fixed;z-index:31;right:max(18px,calc((100vw - 640px)/2 + 18px));
  bottom:calc(var(--tab-h) + var(--sab) + 16px);width:62px;height:62px;border-radius:22px;
  background:var(--accent);color:#fff;display:grid;place-items:center;
  box-shadow:0 8px 22px rgba(60,90,220,.38);transition:transform .15s}
.fab:active{transform:scale(.93)}
.fab svg{width:30px;height:30px;stroke:#fff;stroke-width:2.6;stroke-linecap:round;fill:none}
body.sheet-open .fab{display:none}

/* ---------- folha (formulários) ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,12,20,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:var(--kb,0px);margin:0 auto;max-width:640px;
  max-height:calc(var(--vvh,100dvh) - 14px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);
  transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:0 18px calc(var(--sab) + 18px)}
.sheet.open{transform:translateY(0)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 2px}
.shead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);padding:6px 0 8px;z-index:2}
.shead h2{margin:0;font-size:17px}
.shead button{min-height:44px;min-width:70px;font-weight:600;color:var(--muted)}
.shead .ok{color:var(--accent);text-align:right;font-weight:700}
.amount{display:flex;justify-content:center;align-items:baseline;gap:8px;padding:6px 0 10px}
.amount span{font-size:26px;font-weight:700;color:var(--muted)}
.amount input{border:0;background:none;outline:none;font-size:46px;font-weight:800;width:5ch;min-width:0;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:0}
.amount input::placeholder{color:var(--line)}
.amount.despesa input{color:var(--red)}.amount.receita input{color:var(--green)}
.field{margin-top:16px}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:7px}
.in{display:block;width:100%;min-height:52px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--bg);-webkit-appearance:none;appearance:none;outline:none;min-width:0}
.in:focus{border-color:var(--accent)}
select.in{-webkit-appearance:menulist;appearance:auto}
textarea.in{resize:none;min-height:70px}
input[type=date].in{text-align:left;line-height:1.2}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cc{display:flex;align-items:center;gap:6px;min-height:46px;padding:0 13px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--bg);font-size:15px;font-weight:500}
.cc.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emo button{aspect-ratio:1;border-radius:12px;font-size:22px;display:grid;place-items:center;border:1.5px solid transparent;background:var(--bg)}
.emo button.on{border-color:var(--accent);background:var(--accent-soft)}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.cols button{aspect-ratio:1;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.cols button.on{box-shadow:0 0 0 3px var(--accent)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:17px;
  font-weight:700;font-size:17px;background:var(--accent);color:#fff;text-align:center}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.cancel{background:transparent;color:var(--muted)}
.btns{display:grid;gap:10px;margin-top:22px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* ---------- diálogo + toast ---------- */
.dlg{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(8,12,20,.5);opacity:0;pointer-events:none;transition:opacity .2s;padding:0 12px calc(var(--sab) + 12px)}
.dlg.open{opacity:1;pointer-events:auto}
.dlg-p{width:100%;max-width:520px;background:var(--card);border-radius:24px;padding:20px 16px 12px;display:grid;gap:8px}
.dlg-p h3{margin:0;text-align:center;font-size:18px}
.dlg-p p{margin:0 8px 8px;text-align:center;color:var(--muted);font-size:15px}
.toast{position:fixed;z-index:70;left:50%;bottom:calc(var(--tab-h) + var(--sab) + 92px);transform:translate(-50%,20px);
  background:#222a38;color:#fff;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:14px;
  opacity:0;pointer-events:none;transition:.25s;max-width:92vw;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#9db4ff;font-weight:700;min-height:32px}
body.sheet-open .toast{bottom:calc(var(--sab) + 24px)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><main id="screen" aria-live="polite"></main></div>

<button class="fab" id="fab" data-a="add" aria-label="Novo lançamento">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabbar" aria-label="Navegação principal">
  <button class="tab" data-a="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Início</button>
  <button class="tab" data-a="tab" data-tab="tx"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Lançamentos</button>
  <button class="tab" data-a="tab" data-tab="budget"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r=".6"/></svg>Orçamento</button>
  <button class="tab" data-a="tab" data-tab="reports"><svg viewBox="0 0 24 24"><path d="M5 20v-7M12 20V5M19 20v-11"/></svg>Relatórios</button>
  <button class="tab" data-a="tab" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Ajustes</button>
</nav>

<div class="scrim" id="scrim" data-a="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" inert><div class="grab"></div><div id="sheetBody"></div></div>
<div class="dlg" id="dlg"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<noscript><p style="padding:24px">Este aplicativo precisa de JavaScript para funcionar.</p></noscript>
<script>
'use strict';
(function () {

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const KEY = 'gastos-pessoais:v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');

// Valores são guardados em CENTAVOS (inteiros) para evitar erros de ponto flutuante.
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const money = c => BRL.format(c / 100);
const maskFmt = c => Math.floor(c / 100).toLocaleString('pt-BR') + ',' + pad(c % 100);
const parseMask = v => Math.min(Number(String(v).replace(/\D/g, '')) || 0, 99999999999);
const compact = c => {
  const v = Math.abs(c) / 100;
  if (v >= 1e6) return (v / 1e6).toFixed(1).replace('.', ',') + ' mi';
  if (v >= 1e3) return (v / 1e3).toFixed(v >= 1e4 ? 0 : 1).replace('.', ',') + ' mil';
  return String(Math.round(v));
};

const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const curYm = () => today().slice(0, 7);
const addM = (ym, n) => { const [y, m] = ym.split('-').map(Number); const t = y * 12 + (m - 1) + n; return `${Math.floor(t / 12)}-${pad(t % 12 + 1)}`; };
const dim = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const mkDate = (ym, day) => `${ym}-${pad(Math.min(day, dim(ym)))}`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const asDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const monthLabel = ym => { const [y, m] = ym.split('-').map(Number); return cap(new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })); };
const monthName = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long' }); };
const monthShort = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', ''); };
const dayLabel = s => {
  if (s === today()) return 'Hoje';
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (s === ymd(y)) return 'Ontem';
  const d = asDate(s);
  return cap(d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '')) + ', ' + d.getDate() + ' de ' + d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
};
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const tint = (hex, a = .16) => {
  if (!/^#[0-9a-f]{3,6}$/i.test(hex || '')) return `rgba(128,128,128,${a})`;
  let h = hex.slice(1); if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const n = parseInt(h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
};

function normalize(d) {
  const b = defaults();
  d = d && typeof d === 'object' ? d : {};
  const okTx = t => t && typeof t === 'object' && (t.tipo === 'despesa' || t.tipo === 'receita') &&
    Number.isFinite(t.valor) && t.valor >= 0 && /^\d{4}-\d{2}-\d{2}$/.test(t.date || '');
  return {
    v: 1,
    categories: Array.isArray(d.categories) && d.categories.length ? d.categories.filter(c => c && c.id && c.name) : b.categories,
    accounts: Array.isArray(d.accounts) && d.accounts.length ? d.accounts.filter(a => a && a.id && a.name) : b.accounts,
    transactions: Array.isArray(d.transactions) ? d.transactions.filter(okTx).map(t => ({ ...t, valor: Math.round(t.valor), id: t.id || uid() })) : [],
    budgets: d.budgets && typeof d.budgets === 'object' && !Array.isArray(d.budgets) ? d.budgets : {},
    recs: Array.isArray(d.recs) ? d.recs.filter(r => r && r.id && r.start) : [],
    settings: Object.assign({ theme: 'auto', lastAcc: null, lastForma: 'Pix', lastCat: {} }, d.settings || {})
  };
}

}

}

const inMonth = ym => db.transactions.filter(t => t.date.startsWith(ym));
const sum = (arr, tipo) => arr.reduce((s, t) => t.tipo === tipo ? s + t.valor : s, 0);
const cmpTx = (a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.ts || 0) - (a.ts || 0);
const balance = a => {
  const lim = today(); let b = a.inicial || 0;
  for (const t of db.transactions) { if (t.acc === a.id && t.date <= lim) b += t.tipo === 'receita' ? t.valor : -t.valor; }
  return b;
};

/* ---------- recorrências e parcelas ---------- */
// Gera as ocorrências mensais pendentes de cada despesa/receita recorrente
// até o mês visualizado (limitado a 12 meses à frente).
function ensureRecs(upto) {
  const limit = addM(curYm(), 12);
  let target = upto && upto > curYm() ? upto : curYm();
  if (target > limit) target = limit;
  let changed = false;
  for (const r of db.recs) {
    if (r.end) continue;
    let last = r.last || addM(r.start, -1);
    while (last < target) {
      last = addM(last, 1);
      db.transactions.push({ id: uid(), ts: Date.now(), tipo: r.tipo, valor: r.valor, desc: r.desc, cat: r.cat, acc: r.acc,
        forma: r.forma, obs: r.obs, date: mkDate(last, r.day), serie: r.id, serieTipo: 'rec' });
      changed = true;
    }
    if (r.last !== last) { r.last = last; changed = true; }
  }
  if (changed) save();
}

function createInstallments(base, total, n) {
  const serie = uid(), each = Math.floor(total / n), rest = total - each * n;
  const ym = base.date.slice(0, 7), day = Number(base.date.slice(8));
  for (let i = 0; i < n; i++) {
    db.transactions.push({ ...base, id: uid(), ts: Date.now() + i, valor: each + (i < rest ? 1 : 0),
      date: mkDate(addM(ym, i), day), serie, serieTipo: 'parc', parc: { n: i + 1, total: n } });
  }
}

function delta(cur, prev, kind) {
  if (!cur && !prev) return '<span class="chip flat">—</span>';
  if (!prev) return '<span class="chip flat">novo</span>';
  const p = (cur - prev) / prev * 100;
  if (Math.abs(p) < 0.5) return '<span class="chip flat">= igual</span>';
  const up = p > 0, good = kind === 'receita' ? up : !up;
  return `<span class="chip ${good ? 'good' : 'bad'}">${up ? '▲' : '▼'} ${Math.abs(p).toFixed(0)}%</span>`;
}

function txRow(t) {
  const c = cat(t.cat), a = acc(t.acc);

}

function filtered() {
  const f = ui.f, q = norm(f.q.trim());
  return db.transactions.filter(t => {
    if (!f.all && !t.date.startsWith(ui.month)) return false;
    if (f.cat && t.cat !== f.cat) return false;
    if (f.acc && t.acc !== f.acc) return false;
    if (f.tipo && t.tipo !== f.tipo) return false;
    if (q && !norm([t.desc, t.obs, cat(t.cat).name, acc(t.acc).name, t.forma].join(' ')).includes(q)) return false;
    return true;
  }).sort(cmpTx);
}

/* ---------- RELATÓRIOS ---------- */
function catTotals(ym, tipo) {
  const m = {};
  inMonth(ym).forEach(t => { if (t.tipo === tipo) m[t.cat] = (m[t.cat] || 0) + t.valor; });
  return Object.entries(m).map(([id, v]) => ({ ...cat(id), v })).sort((a, b) => b.v - a.v);
}

function donut(items, total, label) {
  const R = 70, C = 2 * Math.PI * R;
  let segs = '', off = 0;
  if (!total) segs = `<circle r="${R}" cx="100" cy="100" fill="none" stroke="var(--line)" stroke-width="26"/>`;
  else items.forEach(i => {
    const len = i.v / total * C, gap = items.length > 1 ? Math.min(2, len * .3) : 0, d = Math.max(len - gap, .5);
    segs += `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${esc(i.color)}" stroke-width="26" stroke-dasharray="${d.toFixed(2)} ${(C - d).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
    off += len;
  });
  return `<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Gráfico de ${label} por categoria">
    <g transform="rotate(-90 100 100)">${segs}</g>
    <text class="ds" x="100" y="92" text-anchor="middle" font-size="11" font-weight="600">${total ? 'Total' : 'Sem dados'}</text>
    <text class="dt" x="100" y="115" text-anchor="middle" font-size="${!total ? 19 : money(total).length > 12 ? 14 : money(total).length > 10 ? 16 : 19}" font-weight="800">${total ? money(total) : '—'}</text></svg>`;
}

function bars(ym) {
  const months = [0, 1, 2, 3, 4, 5].map(i => addM(ym, i - 5));
  const data = months.map(m => { const t = inMonth(m); return { m, r: sum(t, 'receita'), d: sum(t, 'despesa') }; });
  const max = Math.max(1, ...data.flatMap(x => [x.r, x.d]));
  const W = 340, H = 200, base = 168, top = 22, slot = W / 6, bw = 17, hh = base - top;
  let s = '';
  [0, .5, 1].forEach(k => {
    const y = base - hh * k;
    s += `<line class="gl" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`;
    if (k) s += `<text x="2" y="${y - 3}" font-size="9">${compact(max * k)}</text>`;
  });
  data.forEach((x, i) => {
    const cx = slot * i + slot / 2, hr = x.r / max * hh, hd = x.d / max * hh, sel = x.m === ym;
    s += `<g class="${sel ? 'sel' : ''}" data-a="pick-month" data-m="${x.m}">
      <rect x="${slot * i}" y="0" width="${slot}" height="${H}" fill="transparent"/>
      <rect class="ba" x="${(cx - bw - 1.5).toFixed(1)}" y="${(base - hr).toFixed(1)}" width="${bw}" height="${Math.max(hr, x.r ? 2 : 0).toFixed(1)}" rx="4"/>
      <rect class="bd" x="${(cx + 1.5).toFixed(1)}" y="${(base - hd).toFixed(1)}" width="${bw}" height="${Math.max(hd, x.d ? 2 : 0).toFixed(1)}" rx="4"/>
      <text class="m" x="${cx}" y="${base + 17}" text-anchor="middle" font-size="11">${esc(monthShort(x.m))}</text></g>`;
  });
  return { svg: `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas dos últimos 6 meses">${s}</svg>`, cur: data[5] };
}

function openSheet(html) {
  $('#sheetBody').innerHTML = html;
  $('#sheet').inert = false;
  $('#sheet').scrollTop = 0;
  $('#sheet').classList.add('open'); $('#scrim').classList.add('open');
  document.body.classList.add('sheet-open', 'locked');
}
function closeSheet() {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open');
  $('#sheet').inert = true;
  document.body.classList.remove('sheet-open', 'locked');
  form = null;
}

function ask({ title, msg, buttons }) {
  return new Promise(res => {
    const d = $('#dlg');
    d.innerHTML = `<div class="dlg-p" role="alertdialog"><h3>${esc(title)}</h3>${msg ? `<p>${esc(msg)}</p>` : ''}${buttons.map((b, i) => `<button class="btn ${b.cls || 'ghost'}" data-i="${i}">${esc(b.t)}</button>`).join('')}</div>`;
    d.classList.add('open');
    const done = v => { d.classList.remove('open'); d.onclick = null; res(v); };
    d.onclick = e => {
      const b = e.target.closest('button[data-i]');
      if (b) return done(buttons[Number(b.dataset.i)].v);
      if (e.target === d) done(null);
    };
  });
}

let toastTimer;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-undo>Desfazer</button>' : ''}`;
  t.classList.add('show');
  t.onclick = e => { if (undo && e.target.closest('[data-undo]')) { undo(); t.classList.remove('show'); } };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), undo ? 6000 : 2400);
}

function shake(el) { if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); if (navigator.vibrate) try { navigator.vibrate(40); } catch (e) {} }

const moneyInput = (id, cents, ph = '0,00') =>

function catChips(tipo, sel) {
  const list = db.categories.filter(c => c.tipo === 'ambos' || c.tipo === tipo);
  return list.map(c => `<button type="button" class="cc ${c.id === sel ? 'on' : ''}" data-a="pick-cat" data-id="${esc(c.id)}"><span>${esc(c.icon)}</span>${esc(c.name)}</button>`).join('');
}

function defaultCat(tipo) {
  const last = db.settings.lastCat && db.settings.lastCat[tipo];
  const ok = id => { const c = db.categories.find(x => x.id === id); return c && (c.tipo === 'ambos' || c.tipo === tipo); };
  if (last && ok(last)) return last;
  // sem histórico: despesa começa em "Outros" (neutro), para não gravar uma categoria errada sem querer
  if (tipo === 'despesa' && ok('outros')) return 'outros';
  const f = db.categories.find(c => c.tipo === tipo) || db.categories.find(c => c.tipo === 'ambos') || db.categories[0];
  return f ? f.id : '';
}

function updateParcPreview() {

  const total = parseMask($('#f-valor').value);
  $('#f-each').textContent = total ? (total % n === 0 ? money(total / n) : '~ ' + money(Math.round(total / n))) : '—';
}

async function saveTx() {
  if (!form) return;
  const valor = parseMask($('#f-valor').value);
  if (!valor) { shake($('#f-amt')); $('#f-valor').focus({ preventScroll: true }); toast('Informe o valor'); return; }
  const date = $('#f-date').value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { shake($('#f-date')); toast('Informe a data'); return; }
  const fields = {
    tipo: form.tipo, valor, desc: $('#f-desc').value.trim(), cat: form.cat, acc: $('#f-acc').value,
    forma: $('#f-forma').value, obs: $('#f-obs').value.trim()
  };
  if (!fields.cat) { toast('Escolha uma categoria'); return; }

  if (form.id) {
    const t = db.transactions.find(x => x.id === form.id);
    if (!t) return closeSheet();
    let scope = 'one';
    if (t.serie) {
      scope = await ask({
        title: 'Alterar lançamento', msg: t.serieTipo === 'rec' ? 'Este lançamento se repete todo mês.' : `Parcela ${t.parc.n} de ${t.parc.total}.`,
        buttons: [{ t: 'Só este', v: 'one' }, { t: 'Este e os próximos', v: 'next' }, { t: 'Cancelar', v: null, cls: 'cancel' }]
      });
      if (!scope) return;
    }
    Object.assign(t, fields, { date });
    if (scope === 'next') {
      db.transactions.filter(x => x.serie === t.serie && x.id !== t.id && x.date > t.date).forEach(x => Object.assign(x, fields));
      if (t.serieTipo === 'rec') { const r = db.recs.find(r => r.id === t.serie); if (r) Object.assign(r, fields); }
    }
  } else {
    const rep = $('#f-rep') ? $('#f-rep').value : 'none';
    const base = { ...fields, date, ts: Date.now() };
    if (rep === 'parc') {
      const n = Math.max(2, Math.min(60, parseInt($('#f-n').value, 10) || 2));
      createInstallments(base, valor, n);
    } else if (rep === 'rec') {
      const r = { id: uid(), ...fields, day: Number(date.slice(8)), start: date.slice(0, 7), last: date.slice(0, 7) };
      db.recs.push(r);
      db.transactions.push({ ...base, id: uid(), serie: r.id, serieTipo: 'rec' });
      ensureRecs(ui.month > date.slice(0, 7) ? ui.month : date.slice(0, 7));
    } else {
      db.transactions.push({ ...base, id: uid() });
    }
    ui.month = date.slice(0, 7);
  }
  db.settings.lastAcc = fields.acc; db.settings.lastForma = fields.forma || db.settings.lastForma;
  db.settings.lastCat = Object.assign({}, db.settings.lastCat, { [fields.tipo]: fields.cat });
  save(); closeSheet(); render();
  toast('Lançamento salvo ✓');
}

async function delTx() {
  const t = form && db.transactions.find(x => x.id === form.id);
  if (!t) return;
  let scope;
  if (t.serie) {
    const b = [{ t: 'Só este', v: 'one' }, { t: 'Este e os próximos', v: 'next' }];
    if (t.serieTipo === 'parc') b.push({ t: 'Todas as parcelas', v: 'all' });
    b.push({ t: 'Cancelar', v: null, cls: 'cancel' });
    scope = await ask({ title: 'Excluir lançamento', msg: t.serieTipo === 'rec' ? 'Este lançamento se repete todo mês.' : `Parcela ${t.parc.n} de ${t.parc.total}.`, buttons: b });
  } else {
    scope = await ask({ title: 'Excluir lançamento?', msg: `${t.desc || cat(t.cat).name} · ${money(t.valor)}`, buttons: [{ t: 'Excluir', v: 'one', cls: 'danger' }, { t: 'Cancelar', v: null, cls: 'cancel' }] });
  }
  if (!scope) return;
  const snap = JSON.stringify(db);
  if (scope === 'one') db.transactions = db.transactions.filter(x => x.id !== t.id);
  else if (scope === 'all') db.transactions = db.transactions.filter(x => x.serie !== t.serie);
  else if (scope === 'next') {
    db.transactions = db.transactions.filter(x => !(x.serie === t.serie && x.date >= t.date));
    if (t.serieTipo === 'rec') {
      const r = db.recs.find(r => r.id === t.serie);
      if (r) { r.end = addM(t.date.slice(0, 7), -1); if (r.end < r.start) db.recs = db.recs.filter(x => x.id !== r.id); }
    }
  }
  save(); closeSheet(); render();
  toast('Lançamento excluído', () => { db = normalize(JSON.parse(snap)); save(); render(); });
}

  <div class="field"><span class="lbl">Tipo</span><div class="seg" id="c-tipo">
    <button class="${form.tipo === 'despesa' ? 'on' : ''}" data-a="c-tipo" data-v="despesa">Despesa</button>
    <button class="${form.tipo === 'receita' ? 'on' : ''}" data-a="c-tipo" data-v="receita">Receita</button>
    <button class="${form.tipo === 'ambos' ? 'on' : ''}" data-a="c-tipo" data-v="ambos">Ambos</button></div></div>
  <div class="field"><span class="lbl">Ícone</span><div class="emo" id="c-emo">${EMOJIS.map(e => `<button type="button" class="${e === form.icon ? 'on' : ''}" data-a="c-icon" data-v="${e}">${e}</button>`).join('')}</div></div>
  <div class="field"><span class="lbl">Cor</span><div class="cols" id="c-cols">${COLORS.map(k => `<button type="button" class="${k === form.color ? 'on' : ''}" style="background:${k}" aria-label="Cor ${k}" data-a="c-color" data-v="${k}"></button>`).join('')}</div></div>
  <div class="btns"><button class="btn" data-a="save-cat">Salvar categoria</button>${c && c.id !== 'outros' ? '<button class="btn danger" data-a="del-cat">Excluir categoria</button>' : ''}</div>`);
  if (!c) $('#c-name').focus({ preventScroll: true });
}

function saveCat() {
  const name = $('#c-name').value.trim();
  if (!name) { shake($('#c-name')); toast('Informe o nome'); return; }
  if (db.categories.some(c => c.id !== form.cat && norm(c.name) === norm(name))) { toast('Já existe uma categoria com esse nome'); return; }
  if (form.cat) { const c = db.categories.find(x => x.id === form.cat); Object.assign(c, { name, icon: form.icon, color: form.color, tipo: form.tipo }); }
  else db.categories.push({ id: 'c' + uid(), name, icon: form.icon, color: form.color, tipo: form.tipo });
  save(); closeSheet(); render(); toast('Categoria salva ✓');
}

async function delCat() {
  const c = db.categories.find(x => x.id === form.cat); if (!c) return;
  const n = db.transactions.filter(t => t.cat === c.id).length;
  const r = await ask({ title: `Excluir “${c.name}”?`, msg: n ? `${n} lançamento${n > 1 ? 's' : ''} ser${n > 1 ? 'ão movidos' : 'á movido'} para “Outros”.` : 'Esta categoria não tem lançamentos.',
    buttons: [{ t: 'Excluir', v: 1, cls: 'danger' }, { t: 'Cancelar', v: null, cls: 'cancel' }] });
  if (!r) return;
  if (!db.categories.some(x => x.id === 'outros')) db.categories.push({ id: 'outros', name: 'Outros', icon: '📦', color: '#8E99A8', tipo: 'ambos' });
  db.transactions.forEach(t => { if (t.cat === c.id) t.cat = 'outros'; });
  db.recs.forEach(x => { if (x.cat === c.id) x.cat = 'outros'; });
  delete db.budgets[c.id];
  db.categories = db.categories.filter(x => x.id !== c.id);
  if (ui.f.cat === c.id) ui.f.cat = '';
  save(); closeSheet(); render();
}

/* ---------- contas ---------- */
function openAcc(id) {
  const a = id ? db.accounts.find(x => x.id === id) : null;
  const ini = a ? a.inicial || 0 : 0;
  form = { acc: a ? a.id : null, tipo: a ? a.tipo : 'conta', color: a ? a.color : COLORS[0], neg: ini < 0 };
  openSheet(`
  <div class="shead"><button data-a="close">Cancelar</button><h2>${a ? 'Editar conta' : 'Nova conta ou cartão'}</h2><button class="ok" data-a="save-acc">Salvar</button></div>
  <div class="field" style="margin-top:6px"><label class="lbl" for="a-name">Nome</label><input id="a-name" class="in" value="${esc(a ? a.name : '')}" maxlength="28" placeholder="Ex.: Nubank, Itaú, Carteira" autocomplete="off"></div>
  <div class="field"><span class="lbl">Tipo</span><div class="seg" id="a-tipo">
    ${Object.entries(ACC_TYPES).map(([k, v]) => `<button class="${form.tipo === k ? 'on' : ''}" data-a="a-tipo" data-v="${k}">${v[0]} ${k === 'conta' ? 'Conta' : k === 'cartao' ? 'Cartão' : 'Dinheiro'}</button>`).join('')}</div></div>
  <div class="field"><label class="lbl" for="a-ini">Saldo inicial</label>
    <div style="display:flex;gap:8px;align-items:center"><div class="seg" id="a-sign" style="flex:none;width:130px"><button class="${form.neg ? '' : 'on'}" data-a="a-sign" data-v="0">+</button><button class="${form.neg ? 'on' : ''}" data-a="a-sign" data-v="1">−</button></div>
    <div class="in" style="display:flex;gap:6px;align-items:center;padding:0 14px"><span class="muted">R$</span>${moneyInput('a-ini', Math.abs(ini)).replace('class="money"', 'class="money" style="border:0;background:none;outline:none;width:100%;min-height:48px"')}</div></div>
    <div class="hint">Para cartão de crédito, use “−” se já houver fatura em aberto.</div></div>
  <div class="field"><span class="lbl">Cor</span><div class="cols" id="a-cols">${COLORS.map(k => `<button type="button" class="${k === form.color ? 'on' : ''}" style="background:${k}" aria-label="Cor ${k}" data-a="a-color" data-v="${k}"></button>`).join('')}</div></div>
  <div class="btns"><button class="btn" data-a="save-acc">Salvar conta</button>${a ? '<button class="btn danger" data-a="del-acc">Excluir conta</button>' : ''}</div>`);
  if (!a) $('#a-name').focus({ preventScroll: true });
}

function saveAcc() {
  const name = $('#a-name').value.trim();
  if (!name) { shake($('#a-name')); toast('Informe o nome'); return; }
  const c = parseMask($('#a-ini').value), inicial = form.neg ? -c : c;
  if (form.acc) Object.assign(db.accounts.find(x => x.id === form.acc), { name, tipo: form.tipo, color: form.color, inicial });
  else db.accounts.push({ id: 'a' + uid(), name, tipo: form.tipo, color: form.color, inicial });
  save(); closeSheet(); render(); toast('Conta salva ✓');
}

async function delAcc() {
  const a = db.accounts.find(x => x.id === form.acc); if (!a) return;
  if (db.accounts.length < 2) { toast('Mantenha ao menos uma conta'); return; }
  const n = db.transactions.filter(t => t.acc === a.id).length;
  if (n) { await ask({ title: 'Não é possível excluir', msg: `Há ${n} lançamento${n > 1 ? 's' : ''} nesta conta. Edite-${n > 1 ? 'os' : 'o'} para outra conta antes de excluir.`, buttons: [{ t: 'Entendi', v: 1 }] }); return; }
  const r = await ask({ title: `Excluir “${a.name}”?`, buttons: [{ t: 'Excluir', v: 1, cls: 'danger' }, { t: 'Cancelar', v: null, cls: 'cancel' }] });
  if (!r) return;
  db.accounts = db.accounts.filter(x => x.id !== a.id);
  db.recs.forEach(x => { if (x.acc === a.id) x.acc = db.accounts[0].id; });
  if (ui.f.acc === a.id) ui.f.acc = '';
  save(); closeSheet(); render();
}

/* ---------- recorrências ---------- */
async function openRec(id) {
  const r = db.recs.find(x => x.id === id); if (!r) return;
  const res = await ask({ title: r.desc || cat(r.cat).name, msg: `${money(r.valor)} · todo dia ${r.day}. Para alterar o valor de um mês, edite o lançamento na lista.`,
    buttons: [{ t: 'Encerrar recorrência', v: 'end', cls: 'danger' }, { t: 'Fechar', v: null, cls: 'cancel' }] });
  if (res !== 'end') return;
  const snap = JSON.stringify(db), cm = curYm();
  db.transactions = db.transactions.filter(t => !(t.serie === r.id && t.date.slice(0, 7) > cm));
  r.end = cm;
  save(); render();
  toast('Recorrência encerrada', () => { db = normalize(JSON.parse(snap)); save(); render(); });
}

/* =====================================================================
   BACKUP / EXPORTAÇÃO
   ===================================================================== */
async function saveFile(name, mime, text) {
  const blob = new Blob([text], { type: mime });
  try {
    const file = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function exportJson() {
  const payload = { app: 'gastos-pessoais', version: 1, exportedAt: new Date().toISOString(), data: db };
  saveFile(`gastos-backup-${today()}.json`, 'application/json', JSON.stringify(payload, null, 2));
}

function exportCsv() {
  const q = s => { s = String(s == null ? '' : s); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const rows = [['Data', 'Tipo', 'Descrição', 'Categoria', 'Conta/Cartão', 'Forma de pagamento', 'Valor (R$)', 'Parcela', 'Observação'].map(q).join(';')];
  db.transactions.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts || 0) - (b.ts || 0)).forEach(t => {
    const [y, m, d] = t.date.split('-');
    const v = ((t.tipo === 'despesa' ? -t.valor : t.valor) / 100).toFixed(2).replace('.', ',');
    rows.push([`${d}/${m}/${y}`, t.tipo === 'despesa' ? 'Despesa' : 'Receita', t.desc, cat(t.cat).name, acc(t.acc).name, t.forma, v, t.parc ? `${t.parc.n}/${t.parc.total}` : '', t.obs]
      .map((x, i) => i === 0 || i === 6 ? '"' + x + '"' : q(x)).join(';'));
  });
  saveFile(`gastos-lancamentos-${today()}.csv`, 'text/csv;charset=utf-8', '﻿' + rows.join('\r\n'));
}

async function importJson(file) {
  let parsed;
  try { parsed = JSON.parse(await file.text()); } catch (e) { toast('Arquivo inválido: não é um JSON'); return; }
  const data = parsed && parsed.data && typeof parsed.data === 'object' ? parsed.data : parsed;
  if (!data || !Array.isArray(data.transactions) || !Array.isArray(data.categories) || !Array.isArray(data.accounts)) { toast('Arquivo inválido: não parece um backup deste app'); return; }
  const next = normalize(data);
  const r = await ask({ title: 'Importar backup?', msg: `Os dados atuais (${db.transactions.length} lançamentos) serão substituídos por ${next.transactions.length} lançamentos do arquivo.`,
    buttons: [{ t: 'Substituir dados', v: 1, cls: 'danger' }, { t: 'Cancelar', v: null, cls: 'cancel' }] });
  if (!r) return;
  db = next; ui.f = { q: '', cat: '', acc: '', tipo: '', all: false };
  save(); applyTheme(); render(); toast('Backup importado ✓');
}

async function wipe() {
  const r = await ask({ title: 'Apagar todos os dados?', msg: 'Lançamentos, contas, categorias e orçamentos serão removidos deste aparelho. Exporte um backup antes se precisar.',
    buttons: [{ t: 'Apagar tudo', v: 1, cls: 'danger' }, { t: 'Cancelar', v: null, cls: 'cancel' }] });
  if (!r) return;
  db = defaults(); ui.f = { q: '', cat: '', acc: '', tipo: '', all: false }; ui.month = curYm();
  save(); applyTheme(); render(); toast('Dados apagados');
}

/* =====================================================================
   TEMA
   ===================================================================== */
function applyTheme() {
  const t = db.settings.theme, root = document.documentElement;
  if (t === 'light' || t === 'dark') root.dataset.theme = t; else delete root.dataset.theme;
  $$('meta[name="theme-color"]').forEach(m => {
    if (t === 'light') m.content = '#F4F6FA'; else if (t === 'dark') m.content = '#0E1117';
    else m.content = m.media && m.media.includes('dark') ? '#0E1117' : '#F4F6FA';
  });
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
const A = {
  tab(el) { ui.tab = el.dataset.tab; render(); window.scrollTo(0, 0); },
  mprev() { ui.month = addM(ui.month, -1); render(); },
  mnext() { ui.month = addM(ui.month, 1); render(); },
  mnow() { if (ui.month !== curYm()) { ui.month = curYm(); render(); } },
  add() { openTx(null); },
  close() { closeSheet(); },
  'tx-open'(el) { openTx(el.dataset.id); },
  'save-tx'() { saveTx(); },
  'del-tx'() { delTx(); },
  'f-tipo'(el) { setFormTipo(el.dataset.v); },
  'pick-cat'(el) { form.cat = el.dataset.id; $$('#f-cats .cc').forEach(b => b.classList.toggle('on', b === el)); },
  more() { ui.limit += 80; renderTxList(); },
  rmode(el) { ui.rmode = el.dataset.v; render(); },
  'pick-month'(el) { ui.month = el.dataset.m; render(); },
  theme(el) { db.settings.theme = el.dataset.v; save(); applyTheme(); render(); },
  'budget-open'(el) { openBudget(el.dataset.id); },
  'save-budget'() {
    const v = parseMask($('#f-valor').value);
    if (!v) { shake($('#f-amt')); toast('Informe o limite ou use “Remover limite”'); return; }
    db.budgets[form.budget] = v; save(); closeSheet(); render(); toast('Limite salvo ✓');
  },
  'rm-budget'() { delete db.budgets[form.budget]; save(); closeSheet(); render(); },
  'cat-new'() { openCat(null); }, 'cat-edit'(el) { openCat(el.dataset.id); },
  'save-cat'() { saveCat(); }, 'del-cat'() { delCat(); },
  'c-tipo'(el) { form.tipo = el.dataset.v; $$('#c-tipo button').forEach(b => b.classList.toggle('on', b === el)); },
  'c-icon'(el) { form.icon = el.dataset.v; $$('#c-emo button').forEach(b => b.classList.toggle('on', b === el)); },
  'c-color'(el) { form.color = el.dataset.v; $$('#c-cols button').forEach(b => b.classList.toggle('on', b === el)); },
  'acc-new'() { openAcc(null); }, 'acc-edit'(el) { openAcc(el.dataset.id); },
  'save-acc'() { saveAcc(); }, 'del-acc'() { delAcc(); },
  'a-tipo'(el) { form.tipo = el.dataset.v; $$('#a-tipo button').forEach(b => b.classList.toggle('on', b === el)); },
  'a-sign'(el) { form.neg = el.dataset.v === '1'; $$('#a-sign button').forEach(b => b.classList.toggle('on', b === el)); },
  'a-color'(el) { form.color = el.dataset.v; $$('#a-cols button').forEach(b => b.classList.toggle('on', b === el)); },
  'rec-open'(el) { openRec(el.dataset.id); },
  'export-json'() { exportJson(); },
  'import-json'() { $('#importFile').click(); },
  'export-csv'() { exportCsv(); },
  wipe() { wipe(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const fn = A[el.dataset.a];
  if (fn) fn(el, e);
});

// máscara de valor em reais: digita só números, os centavos entram da direita para a esquerda
document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList && el.classList.contains('money')) {
    const c = parseMask(el.value);
    el.value = c ? maskFmt(c) : '';
    if (el.closest('.amount')) fitMoney(el);
    if (el.id === 'f-valor' && $('#f-parc') && !$('#f-parc').hidden) updateParcPreview();
  } else if (el.id === 'q') { ui.f.q = el.value; ui.limit = 80; renderTxList(); }
  else if (el.id === 'f-n') updateParcPreview();
});

document.addEventListener('change', e => {
  const el = e.target;
  switch (el.id) {
    case 'fcat': ui.f.cat = el.value; ui.limit = 80; renderTxList(); break;
    case 'facc': ui.f.acc = el.value; ui.limit = 80; renderTxList(); break;
    case 'ftipo': ui.f.tipo = el.value; ui.limit = 80; renderTxList(); break;
    case 'fall': ui.f.all = el.checked; ui.limit = 80; render(); break;
    case 'f-rep':
      $('#f-parc').hidden = el.value !== 'parc'; $('#f-recnote').hidden = el.value !== 'rec';
      if (el.value === 'parc') updateParcPreview();
      break;
    case 'importFile':
      if (el.files && el.files[0]) importJson(el.files[0]);
      el.value = '';
      break;
  }
});

// Enter nos campos de texto do formulário salva / fecha o teclado
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !form) return;
  const t = e.target;
  if (t.tagName === 'TEXTAREA') return;
  if (t.matches && t.matches('input')) {
    e.preventDefault();
    if (form.budget) A['save-budget']();
    else if (t.id === 'f-valor') $('#f-desc').focus({ preventScroll: true });
    else t.blur();
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('open') && !$('#dlg').classList.contains('open')) closeSheet(); });

// mantém a folha visível acima do teclado no iPhone
if (window.visualViewport) {
  const vv = window.visualViewport, root = document.documentElement;
  const upd = () => {
    root.style.setProperty('--vvh', vv.height + 'px');
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    root.style.setProperty('--kb', (kb < 2 ? 0 : kb) + 'px');
  };
  vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd); upd();
}

// ao voltar para o app (ex.: virou o dia), gera recorrências pendentes
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !$('#sheet').classList.contains('open')) {
    const before = db.transactions.length; ensureRecs(ui.month);
    if (db.transactions.length !== before) render();
  }
});

/* =====================================================================
   INÍCIO
   ===================================================================== */
db = load();
applyTheme();
render();

if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW', err)); });
}

})();

</script>
</body>
</html>
